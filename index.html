 <!-- KODE MENU MAKANAN MULAI DARI SINI -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pesanan - TokoKu</title>
    <style>
        body { background: #f5f5f5; font-family: Arial; padding: 20px; }
        h1 { color: #ff5722; }
        .menu-item { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-item h3 { margin-bottom: 5px; }
        .harga { color: #ff5722; font-weight: bold; font-size: 16px; }
        .pesan { margin-top: 8px; }
        .pesan button { width: 30px; height: 30px; }
        .pesan input { width: 40px; text-align: center; }
    </style>
</head>
<body>
    <h1>Menu Makanan</h1>
    
    <div class="menu-item">
        <h3>Nasi Goreng Spesial</h3>
        <div class="harga">Rp 18.000</div>
        <div class="pesan">
            <button>-</button> <input type="text" value="0"> <button>+</button>
        </div>
    </div>

    <div class="menu-item">
        <h3>Ayam Geprek Level 3</h3>
        <div class="harga">Rp 15.000</div>
        <div class="pesan">
            <button>-</button> <input type="text" value="0"> <button>+</button>
        </div>
    </div>

    <div class="menu-item">
        <h3>Es Teh Manis</h3>
        <div class="harga">Rp 5.000</div>
        <div class="pesan">
            <button>-</button> <input type="text" value="0"> <button>+</button>
        </div>
    </div>

    <div class="menu-item">
        <h3>Mie Ayam Bakso</h3>
        <div class="harga">Rp 20.000</div>
        <div class="pesan">
            <button>-</button> <input type="text" value="0"> <button>+</button>
        </div>
    </div>
</body>
</html>
