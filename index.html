<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Barang & Pembelian</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 5px; color: #007bff; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, select, button { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        button.btn-edit { background-color: #ffc107; color: #212529; }
        button.btn-cancel { background-color: #dc3545; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
        th { background-color: #e9ecef; }
    </style>
</head>
<body>

    <h1>Sistem Inventaris & Pembelian (GitHub Ready)</h1>
    <hr>

    <div class="container">
        <!-- SEKSI 1: DATA BARANG & STOK -->
        <div class="card">
            <h2>Data Barang & Stok</h2>
            
            <!-- Form Input & Edit Barang -->
            <form id="form-barang">
                <input type="hidden" id="barang-id">
                <label>Nama Barang:</label>
                <input type="text" id="barang-nama" required>
                <label>Harga (Rp):</label>
                <input type="number" id="barang-harga" min="0" required>
                <label>Stok:</label>
                <input type="number" id="barang-stok" min="0" required>
                
                <button type="submit" id="btn-simpan-barang">Simpan Barang</button>
                <button type="button" id="btn-batal-barang" class="btn-cancel" style="display:none;" onclick="resetFormBarang()">Batal</button>
            </form>

            <!-- Tabel View Barang -->
            <h3>Daftar Barang (View)</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-barang"></tbody>
            </table>
        </div>

        <!-- SEKSI 2: TRANSAKSI PEMBELIAN -->
        <div class="card">
            <h2>Transaksi Pembelian</h2>
            
            <!-- Form Input & Edit Pembelian -->
            <form id="form-pembelian">
                <input type="hidden" id="pembelian-id">
                <label>Pilih Barang:</label>
                <select id="pembelian-barang-id" required>
                    <option value="">-- Pilih Barang --</option>
                </select>
                <label>Jumlah Beli:</label>
                <input type="number" id="pembelian-jumlah" min="1" required>
                
                <button type="submit" id="btn-simpan-pembelian">Simpan Transaksi</button>
                <button type="button" id="btn-batal-pembelian" class="btn-cancel" style="display:none;" onclick="resetFormPembelian()">Batal</button>
            </form>

            <!-- Tabel View Pembelian -->
            <h3>Riwayat Pembelian (View)</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Barang</th>
                        <th>Jumlah</th>
                        <th>Total Harga</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-pembelian"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
