<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Shop - Admin & Toko</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #e6f3ff; }
    
    /* LOGIN STYLE */
    .login-box{width:350px; margin:100px auto; padding:30px; background:white; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
    .login-box input{width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;}
    .login-box button{width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;}
    .dashboard{display:none;}
    
    /* TOKO STYLE */
    body.toko-bg { background: #e6f3ff; padding-bottom: 80px; }
    .header { background: #007bff; color: white; padding: 12px 15px; position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-top h1 { font-size: 20px; font-weight: bold; }
    .header-menu { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn-menu { background:white; color:#007bff; border:none; padding:6px 10px; border-radius:15px; font-size:12px; font-weight:bold; cursor:pointer; }
    .keranjang-icon { position: relative; font-size: 24px; cursor: pointer; }
    .keranjang-count { position: absolute; top: -5px; right: -8px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; }
    .tabs { background: white; padding: 10px 15px; display: flex; gap: 10px; overflow-x: auto; }
    .tab { background: #007bff; color: white; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer; }
    .tab.active { background: #0056b3; }
    .flash { background: #007bff; color: white; margin: 15px; padding: 12px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 14px; }
    .container { padding: 0 15px; }
    .container h2 { font-size: 16px; margin: 15px 0; }
    .produk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .produk-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .produk-img img { width: 100%; height: 160px; object-fit: cover; }
    .badge { position: absolute; background: red; color: white; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: bold; margin: 8px; }
    .produk-img { position: relative; }
    .produk-info { padding: 10px; }
    .produk-info h3 { font-size: 14px; margin-bottom: 4px; height: 36px; overflow: hidden; }
    .produk-info p { font-size: 11px; color: #777; margin-bottom: 6px; }
    .harga { color: #007bff; font-weight: bold; font-size: 16px; }
    .harga span { color: #999; font-size: 11px; text-decoration: line-through; margin-left: 5px; }
    .btn-keranjang { width: 100%; background: #007bff; color: white; border: none; padding: 9px; border-radius: 8px; margin-top: 8px; font-weight: bold; cursor: pointer; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 15; }
    .overlay.show { display: block; }
    .popup-keranjang { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; padding: 20px 15px; transform: translateY(100%); transition: 0.3s; z-index: 20; max-height: 70vh; overflow-y: auto; }
    .popup-keranjang.show { transform: translateY(0); }
    .popup-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
    .item-keranjang { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
    .btn-hapus { background: red; color: white; border: none; padding: 4px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
    .total { font-weight: bold; font-size: 18px; color: #007bff; border-top: 2px solid #eee; padding-top: 12px; margin-top: 10px; text-align: right; }
    .btn-bayar { width: 100%; background: #007bff; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
    .kosong { text-align: center; color: #999; padding: 20px 0; }
    .btn-logout {background:red; border:none; color:white; padding:8px 15px; border-radius:5px; cursor:pointer;}

    /* HALAMAN BARU */
    .page {display:none; padding:15px;}
    .card{background:white; padding:15px; border-radius:10px; margin-bottom:15px; box-shadow:0 2px 5px rgba(0,0,0,0.05);}
    table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
    table, th, td{border:1px solid #ddd; padding:8px; text-align:left;}
    th{background:#007bff; color:white;}
    .form-input input,.form-input select{width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px;}
    .btn{padding:10px 15px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;}
    .status-diproses{background:orange; color:white; padding:3px 8px; border-radius:10px; font-size:11px;}
    .status-dikirim{background:#007bff; color:white; padding:3px 8px; border-radius:10px; font-size:11px;}
    .status-selesai{background:green; color:white; padding:3px 8px; border-radius:10px; font-size:11px;}
    @media(max-width:600px){.header-menu{width:100%; justify-content:flex-end;}}
</style>
</head>
<body>

<!-- 1. HALAMAN LOGIN -->
<div class="login-box" id="loginBox">
  <h2 style="text-align:center; margin-bottom:10px;">Login Admin</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Masuk</button>
  <p id="error" style="color:red; text-align:center; margin-top:10px;"></p>
</div>

<!-- 2. HALAMAN DASHBOARD TOKO -->
<div class="dashboard" id="dashboard">
    <div class="header">
        <div class="header-top">
            <h1>🛍️ City Shop</h1>
            <div class="header-menu">
                <button class="btn-menu" onclick="showPage('tokoPage')">🏪 Toko</button>
                <button class="btn-menu" onclick="showPage('pengirimanPage')">🚚 Pengiriman</button>
                <button class="btn-menu" onclick="showPage('laporanPage')">📑 Laporan</button>
                <div class="keranjang-icon" onclick="toggleKeranjang()">🛒<span class="keranjang-count" id="jumlahKeranjang">0</span></div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <!-- PAGE TOKO -->
    <div id="tokoPage" class="page" style="display:block;">
        <div class="tabs">
            <div class="tab active" onclick="filterKategori('semua', event)">Semua</div>
            <div class="tab" onclick="filterKategori('sepatu', event)">Sepatu</div>
            <div class="tab" onclick="filterKategori('sekolah', event)">Alat Sekolah</div>
            <div class="tab" onclick="filterKategori('baju', event)">Baju</div>
        </div>
        <div class="flash">📚 BACK TO SCHOOL - DISKON UP TO 50% 📚</div>
        <div class="container"><h2 id="judulKategori">Rekomendasi Untuk Kamu</h2><div class="produk-grid" id="daftarProduk"></div></div>
    </div>

    <!-- PAGE STATUS PENGIRIMAN -->
    <div id="pengirimanPage" class="page">
        <h2>🚚 Status Pengiriman</h2>
        <div class="card form-input">
            <h3>Input Pesanan Baru</h3>
            <input type="text" id="namaPelanggan" placeholder="Nama Pelanggan">
            <input type="text" id="alamatPelanggan" placeholder="Alamat">
            <select id="barangDipesan"></select>
            <input type="number" id="jumlahDipesan" placeholder="Jumlah">
            <select id="statusPesanan">
                <option value="Diproses">Diproses</option>
                <option value="Dikirim">Dikirim</option>
                <option value="Selesai">Selesai</option>
            </select>
            <button class="btn" onclick="tambahPesanan()">Simpan Pesanan</button>
        </div>
        <div class="card">
            <h3>Daftar Pesanan</h3>
            <table>
