<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Center - Fashion Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
        body { background: #f5f5f5; padding-bottom: 70px; }
        
        /* NAVBAR */
        .navbar { background: #ff5722; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .navbar h1 { font-size: 18px; }

        /* DASHBOARD STAT */
        .container { padding: 20px; }
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-card h4 { font-size: 13px; color: #777; margin-bottom: 5px; }
        .stat-card h2 { font-size: 22px; color: #ff5722; }

        /* KATEGORI PRODUK */
        .kategori { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .kategori h3 { margin-bottom: 15px; font-size: 16px; }
        .kategori-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; text-align: center; }
        .kategori-item img { width: 100%; height: 80px; border-radius: 8px; object-fit: cover; margin-bottom: 5px; }
        .kategori-item p { font-size: 12px; color: #333; font-weight: bold; }

        /* PRODUK TERLARIS */
        .produk { background: white; padding: 15px; border-radius: 10px; }
        .produk h3 { margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .produk-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .produk-item img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; }
        .produk-info { flex: 1; }
        .produk-info h4 { font-size: 14px; margin-bottom: 3px; }
        .produk-info p { font-size: 12px; color: #777; }
        .harga { color: #ff5722; font-weight: bold; font-size: 14px; }
        .btn-edit { background: white; color: #ff5722; border: 1px solid #ff5722; padding: 6px 12px; border-radius: 5px; font-size: 12px; }
        
        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
        .bottom-nav div { text-align: center; font-size: 11px; color: #777; }
        .bottom-nav .active { color: #ff5722; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <div class="navbar">
        <h1>Fashion Store Seller</h1>
        <div>👤</div>
    </div>

    <div class="container">
        <!-- STATISTIK -->
        <div class="stat-grid">
            <div class="stat-card">
                <h4>Pesanan Baru</h4>
                <h2>24</h2>
            </div>
            <div class="stat-card">
                <h4>Penjualan Bulan Ini</h4>
                <h2>Rp 8.5 jt</h2>
            </div>
        </div>

        <!-- KATEGORI PRODUK -->
        <div class="kategori">
            <h3>Kategori Produk</h3>
            <div class="kategori-grid">
                <div class="kategori-item">
                    <img src="https://img.freepik.com/free-photo/stylish-man-shirt_23-2148248001.jpg?w=200" alt="Baju">
                    <p>Baju</p>
                </div>
                <div class="kategori-item">
                    <img src="https://img.freepik.com/free-photo/jeans-pants_23-2148247995.jpg?w=200" alt="Celana">
                    <p>Celana</p>
                </div>
                <div class="kategori-item">
                    <img src="https://img.freepik.com/free-photo/sneakers-shoes_23-2148247989.jpg?w=200" alt="Sepatu">
                    <p>Sepatu</p>
                </div>
            </div>
        </div>

        <!-- PRODUK TERLARIS -->
        <div class="produk">
            <h3>Produk Terlaris</h3>
            
            <div class="produk-item">
                <img src="https://img.freepik.com/free-photo/casual-tshirt-mockup_23-2148247998.jpg?w=200" alt="Kaos">
                <div class="produk-info">
                    <h4>
