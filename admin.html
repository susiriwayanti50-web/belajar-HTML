<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>City Shop</title>
<style>
body{font-family:Arial; background:#e6f3ff; margin:0;}
.login{width:300px; margin:100px auto; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px #ccc; text-align:center;}
input{width:90%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:5px;}
button{width:95%; padding:10px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer;}
#admin,#customer{display:none; padding:20px;}
.produk{display:inline-block; width:45%; background:white; margin:5px; padding:10px; border-radius:10px; text-align:left;}
.produk img{width:100%; height:120px; object-fit:cover; border-radius:5px;}
</style>
</head>
<body>

<div class="login" id="login">
<h2>Login City Shop</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="masuk()">Masuk</button>
<p style="font-size:12px; margin-top:10px;">Admin: suci / 12345 <br> Pelanggan: rara / 12345</p>
<p id="err" style="color:red"></p>
</div>

<div id="admin">
<h1>Dashboard Admin - SUCI</h1>
<p>Ini halaman admin. Ada menu Input Barang, Laporan dll</p>
<button onclick="logout()">Logout</button>
</div>

<div id="customer">
<h1>🛍️ City Shop</h1>
<h3>Rekomendasi Untuk Kamu</h3>
<div class="produk">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
<b>Sepatu Sneakers</b><br>Rp180.000
</div>
<div class="produk">
<img src="https://images.unsplash.com/photo-1543508282-6319a3e262ad?w=400">
<b>Sepatu Olahraga</b><br>Rp250.000
</div>
<div class="produk">
<img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400">
<b>Botol Tumbler</b><br>Rp45.000
</div>
<div class="produk">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400">
<b>Kaos Oversize</b><br>Rp89.000
</div>
<button onclick="logout()" style="margin-top:20px; background:red;">Logout</button>
</div>

<script>
function masuk(){
  let u = document.getElementById('user').value.toLowerCase();
  let p = document.getElementById('pass').value;
  if(u=='suci' && p=='12345'){
    document.getElementById('login').style.display='none';
    document.getElementById('admin').style.display='block';
  }
  else if(u=='rara' && p=='12345'){
    document.getElementById('login').style.display='none';
    document.getElementById('customer').style.display='block';
  }
  else{ document.getElementById('err').innerText = "Username atau Password salah!"; }
}
function logout(){location.reload();}
</script>
</body>
</html>
