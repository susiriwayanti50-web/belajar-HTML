q<!DOCTYPE html>
<html>
<head><title>Login</title>
<style>
body{background:#e6f3ff; font-family:Arial;}
.login{width:300px; margin:100px auto; background:white; padding:30px; border-radius:10px; text-align:center;}
input{width:90%; padding:10px; margin:10px 0;}
button{width:95%; padding:10px; background:#007bff; color:white; border:none; border-radius:5px;}
#admin,#customer{display:none;}
</style>
</head>
<body>

<div class="login" id="login">
<h2>Login</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="masuk()">Masuk</button>
<p style="font-size:12px;">Admin: suci/12345<br>Pelanggan: rara/12345</p>
<p id="err" style="color:red"></p>
</div>

<div id="admin"><h1>SELAMAT DATANG ADMIN SUCI</h1><button onclick="logout()">Logout</button></div>
<div id="customer"><h1>SELAMAT DATANG PELANGGAN RARA</h1><p>Ini halaman toko</p><button onclick="logout()">Logout</button></div>

<script>
function masuk(){
  let u = document.getElementById('user').value.toLowerCase();
  let p = document.getElementById('pass').value;
  if(u=='suci' && p=='12345'){
    document.getElementById('login').style.display='none';
    document.getElementById('admin').style.display='block';
  }
  else if(u=='rara' && p=='12345'){
    document.getElementById('login').style.display='none';
    document.getElementById('customer').style.display='block';
  }
  else{ document.getElementById('err').innerText = "Username atau Password salah!"; }
}
function logout(){location.reload();}
</script>
</body>
</html>
