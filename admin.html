<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>City Shop</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial;}
.login{width:300px; margin:100px auto; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px #ccc; text-align:center;}
input{width:90%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:5px;}
button{width:95%; padding:10px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer;}
#admin,#customer{display:none; padding:20px;}
.produk{display:inline-block; width:45%; background:white; margin:5px; padding:10px; border-radius:10px;}
.produk img{width:100%; height:120px; object-fit:cover; border-radius:5px; cursor:pointer;}
.overlay{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; z-index:10;}
.popup{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; width:90%; max-width:400px; padding:20px; border-radius:10px; display:none; z-index:11;}
</style>
</head>
<body style="background:#e6f3ff;">

<div class="login" id="login">
<h2>Login City Shop</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="masuk()">Masuk</button>
<p id="err" style="color:red"></p>
<p style="font-size:12px;">Admin: suci / 12345 <br> Pelanggan: rara / 12345</p>
</div>

<div id="admin">

<p>Selamat datang Admin. Nanti disini ada Input Barang</p>
<button onclick="logout()">Logout</button>
</div>

<div id="customer">

</div>

<b>Sepatu Olahraga</b><br>Rp250.000
</div>
<button onclick="logout()" style="margin-top:20px; background:red;">Logout</button>
</div>

<div class="overlay" id="overlay" onclick="tutup()"></div>
<div class="popup" id="popup"></div>
